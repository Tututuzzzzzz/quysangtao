version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: quysangtao-db
    restart: always
    environment:
      POSTGRES_DB: leadsgensangtao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2192004
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: quysangtao-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
